version: '3.8'

services:
  # 1. PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: smart_grid_postgres
    environment:
      POSTGRES_DB: smart_grid
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - grid_network

  # 2. Substation Relay (Python)
  substation:
    build:
      context: .
      dockerfile: substation.Dockerfile
    container_name: smart_grid_substation
    environment:
      # Send data to the local laptop's backend
      - CENTRAL_CLOUD_ENDPOINT=http://host.docker.internal:3000/api/cloud/ingest
    ports:
      - "5001:5001"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - grid_network



  # 5. Edge DPU (Raspberry Pi Simulator)
  dpu:
    build:
      context: .
      dockerfile: dpu/Dockerfile
    container_name: smart_grid_dpu
    # Simulate a resource-constrained Edge device (e.g. Raspberry Pi)
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
    environment:
      # Route DPU data through the Substation container
      - SUBSTATION_ENDPOINT=http://substation:5001/api/substation/ingest
      # Reach the backend running locally on the laptop via host.docker.internal
      - BACKEND_CONFIG_URL=http://host.docker.internal:3000/api/config
    volumes:
      # Map the model files from host so the DPU can use them
      - ./transformer_netload_model.pkl:/app/transformer_netload_model.pkl
      - ./transformer_solar_model.pkl:/app/transformer_solar_model.pkl
      - ./model_feature_cols.pkl:/app/model_feature_cols.pkl
      # Persist the local sqlite cache on the host so it isn't lost on restart
      - ./dpu_data:/app/dpu/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - grid_network
  # 6. AI Predictor
  ai_predictor:
    image: python:3.9-slim
    container_name: smart_grid_ai
    volumes:
      - ./:/app
    working_dir: /app
    command: sh -c "pip install flask flask-cors scikit-learn numpy joblib && python ai_server.py"
    ports:
      - "5005:5005"
    networks:
      - grid_network

networks:
  grid_network:
    driver: bridge

volumes:
  pgdata:
